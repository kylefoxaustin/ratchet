[project]
name = "ratchet"
version = "0.2.1"
description = "Generic SoC sizing engine — canonical tier registry, capability taxonomy, LLM projection, anchor-secrets overlay, sliders, KPIs, probes, and Parquet workload records. Shared dependency for drone/video/agentic-AI sizers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kyle Fox" },
]

dependencies = [
    "pyarrow>=14.0",
]

[project.optional-dependencies]
gpu = [
    "nvidia-ml-py>=12.535",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "ratchet",
    "ratchet.engine",
    "ratchet.tiers",
    "ratchet.precision",
    "ratchet.projection",
    "ratchet.anchors",
    "ratchet.catalog",
    "ratchet.calibration",
    "ratchet.whatif",
    "ratchet.probes",
    "ratchet.schemas",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
